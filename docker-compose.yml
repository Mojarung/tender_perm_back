version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TENDER_QDRANT_HOST=qdrant
      - TENDER_QDRANT_PORT=6333
      - TENDER_EMBEDDING_MODEL=perplexity-ai/pplx-embed-v1-0.6b
      - TENDER_CONTRACTS_PATH=/app/data/contracts.json
      - TENDER_CTE_PATH=/app/data/cte.json
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./contracts.json:/app/data/contracts.json:ro
      - ./cte.json:/app/data/cte.json:ro
      - ./templates:/app/templates:ro
      - ./output:/app/output
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

# Removed named volume to use local bind mount instead
