services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODEL=nvidia/llama-nemotron-embed-1b-v2
      - EMBEDDING_API_URL=https://integrate.api.nvidia.com/v1
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_DIMENSIONS=1024
      - ENABLE_EMBEDDINGS=true
      - REINDEX_EMBEDDINGS_ON_STARTUP=false
      - CTE_JSON_PATH=/app/data/cte.json
      - CONTRACTS_JSON_PATH=/app/data/contracts.json
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - C:/Users/roldu/Desktop/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s
