[project]
name = "tender-perm-back"
version = "0.1.0"
description = "NMCC Calculator Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "polars>=1.17.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "docxtpl>=0.18.0",
    "scikit-learn>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
