[project]
name = "tender-perm-back"
version = "1.0.0"
description = "Intelligent NMCK Calculator for Tender Hack Perm"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "polars>=1.20.0",
    "sentence-transformers>=3.4.0",
    "qdrant-client>=1.13.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "scikit-learn>=1.6.0",
    "docxtpl>=0.18.0",
    "jinja2>=3.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "openai>=2.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
